/* ================================================================
   workFlowers tokens — light is the brand default; dark derives from
   the whatsapp-slack-bridge explainer's dark set. Three theme states:
   bare :root = light; media query (guarded) = system-dark; [data-theme]
   stamps win in both directions.
   ================================================================ */
:root {
  --font-sans: "InterVar", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --bg: #FFFFFF;
  --bg-tint: #F5FAFE;
  --surface: #FFFFFF;
  --surface-2: #F5FAFE;
  --ink: #1F1F1F;
  --ink-muted: #4B4B4B;
  --ink-subtle: #6B6B6B;
  --border: rgba(31, 31, 31, 0.12);
  --border-strong: rgba(31, 31, 31, 0.24);
  --divider: rgba(31, 31, 31, 0.08);
  --shadow-sm: 0 1px 2px rgba(31,31,31,0.06);
  --shadow-lg: 0 10px 30px rgba(46,27,136,0.14);

  --indigo: #2E1B88;
  --azure: #1479E1;
  --violet: #4E1B61;
  --ochre: #E17A14;
  --peach: #F6C696;
  --npb: #9CE1FC;

  /* Node/edge encodings */
  --c-durable: var(--indigo);
  --c-ds: var(--violet);
  --c-ds-fill: rgba(78, 27, 97, 0.08);
  --c-table: var(--ochre);
  --c-table-fill: rgba(225, 122, 20, 0.07);
  --c-folder: var(--azure);
  --c-folder-fill: rgba(20, 121, 225, 0.06);
  --c-app: #6B6B6B;
  --c-app-fill: rgba(31, 31, 31, 0.05);
  --c-node-fill: #FFFFFF;
  --c-edge: rgba(31, 31, 31, 0.42);
  --c-edge-read: rgba(31, 31, 31, 0.30);
  --c-hull: rgba(156, 225, 252, 0.14);
  --c-hull-line: rgba(20, 121, 225, 0.25);
  --c-hull-label: #1479E1;
  --focus-ring: var(--azure);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12101C;
    --bg-tint: #171425;
    --surface: #1A1726;
    --surface-2: #211D30;
    --ink: #F2F1F7;
    --ink-muted: #B8B4C7;
    --ink-subtle: #8B879B;
    --border: rgba(242, 241, 247, 0.14);
    --border-strong: rgba(242, 241, 247, 0.28);
    --divider: rgba(242, 241, 247, 0.08);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);

    --indigo: #8B7BE8;
    --azure: #4D9DF0;
    --violet: #B583D4;
    --ochre: #F09A44;
    --peach: #F6C696;
    --npb: #9CE1FC;

    --c-durable: var(--indigo);
    --c-ds: var(--violet);
    --c-ds-fill: rgba(181, 131, 212, 0.12);
    --c-table: var(--ochre);
    --c-table-fill: rgba(240, 154, 68, 0.10);
    --c-folder: var(--azure);
    --c-folder-fill: rgba(77, 157, 240, 0.10);
    --c-app: #8B879B;
    --c-app-fill: rgba(242, 241, 247, 0.06);
    --c-node-fill: #1A1726;
    --c-edge: rgba(242, 241, 247, 0.38);
    --c-edge-read: rgba(242, 241, 247, 0.26);
    --c-hull: rgba(156, 225, 252, 0.05);
    --c-hull-line: rgba(77, 157, 240, 0.30);
    --c-hull-label: #4D9DF0;
  }
}
:root[data-theme="dark"] {
  --bg: #12101C;
  --bg-tint: #171425;
  --surface: #1A1726;
  --surface-2: #211D30;
  --ink: #F2F1F7;
  --ink-muted: #B8B4C7;
  --ink-subtle: #8B879B;
  --border: rgba(242, 241, 247, 0.14);
  --border-strong: rgba(242, 241, 247, 0.28);
  --divider: rgba(242, 241, 247, 0.08);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);

  --indigo: #8B7BE8;
  --azure: #4D9DF0;
  --violet: #B583D4;
  --ochre: #F09A44;
  --peach: #F6C696;
  --npb: #9CE1FC;

  --c-durable: var(--indigo);
  --c-ds: var(--violet);
  --c-ds-fill: rgba(181, 131, 212, 0.12);
  --c-table: var(--ochre);
  --c-table-fill: rgba(240, 154, 68, 0.10);
  --c-folder: var(--azure);
  --c-folder-fill: rgba(77, 157, 240, 0.10);
  --c-app: #8B879B;
  --c-app-fill: rgba(242, 241, 247, 0.06);
  --c-node-fill: #1A1726;
  --c-edge: rgba(242, 241, 247, 0.38);
  --c-edge-read: rgba(242, 241, 247, 0.26);
  --c-hull: rgba(156, 225, 252, 0.05);
  --c-hull-line: rgba(77, 157, 240, 0.30);
  --c-hull-label: #4D9DF0;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------------- Header ---------------- */
header {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: none;
  border-bottom: 1px solid var(--divider);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
/* Brand rule: the mark is never recolored or inverted — used as-is on dark too. */
.brand .wordmark-img { height: 26px; display: block; }
.brand .title { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
.tagline {
  font-size: 12.5px;
  color: var(--ink-subtle);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.stats {
  display: flex;
  gap: 14px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-muted);
  white-space: nowrap;
}
.stats b { color: var(--ink); font-weight: 500; }
#themeToggle {
  font: 500 12px var(--font-sans);
  color: var(--ink-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 5px 10px;
  cursor: pointer;
  transition: opacity 120ms cubic-bezier(0.2,0.6,0.2,1);
}
#themeToggle:hover { opacity: 0.8; }
#themeToggle:focus-visible, .lgd-toggle:focus-visible, #panel a:focus-visible,
#panel button:focus-visible, .asset-row:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}
@media (max-width: 760px) {
  .tagline, .stats { display: none; }
}

/* ---------------- Stage ---------------- */
#stage {
  position: absolute;
  inset: 0;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#stage.panning { cursor: grabbing; }
#stage svg { width: 100%; height: 100%; display: block; }

/* Hulls */
.hull { cursor: grab; }
.hull.dragging { cursor: grabbing; }
.hull rect { fill: var(--c-hull); stroke: var(--c-hull-line); stroke-width: 1.5; }
.hull text { pointer-events: none; }
.hull text {
  /* Bold and fully opaque at every zoom; size counter-scales with k (set in JS)
     so the title holds its screen size instead of fading into the distance. */
  font-family: var(--font-sans);
  font-weight: 800;
  font-size: var(--hull-font, 26px);
  letter-spacing: -0.01em;
  fill: var(--c-hull-label);
}

/* Edges */
.edge { fill: none; stroke: var(--c-edge); transition: opacity 220ms cubic-bezier(0.2,0.6,0.2,1); }
.edge.write { stroke-width: 1.5; }
.edge.read { stroke-width: 1; stroke: var(--c-edge-read); }
.edge.own { stroke-width: 2.5; }
.edge.own.to-table { stroke: var(--c-table); opacity: 0.75; }
.edge.own.to-ds { stroke: var(--c-ds); opacity: 0.75; }
.edge.trigger { stroke: var(--azure); stroke-width: 1.25; opacity: 0.8; }
.edge.reference { stroke-dasharray: 2 5; stroke-width: 1; opacity: 0.35; }
.edge.http { stroke: var(--ochre); stroke-width: 2; }
.edge-dot { fill: var(--azure); }
.edge-glyph { fill: var(--c-edge); opacity: 0; transition: opacity 220ms; }
.edge-glyph.http { fill: var(--ochre); }
svg[data-zoom="near"] .edge-glyph { opacity: 0.7; }

/* Nodes */
.node { cursor: pointer; }
.node .shape {
  fill: var(--c-node-fill);
  stroke-width: 1.5;
  transition: stroke-width 120ms cubic-bezier(0.2,0.6,0.2,1);
}
.node:hover .shape, .node.selected .shape { stroke-width: 3; }
.node.durable .shape { stroke: var(--c-durable); }
.node.classic .shape { stroke: var(--c-app); stroke-dasharray: 5 4; }
.node.table .shape { stroke: var(--c-table); fill: var(--c-table-fill); }
.node.table .ledger { stroke: var(--c-table); stroke-width: 3; }
.node.notion_ds .shape { stroke: var(--c-ds); fill: var(--c-ds-fill); }
.node.drive_folder .shape { stroke: var(--c-folder); fill: var(--c-folder-fill); }
.node.external_app .shape { stroke: var(--c-app); fill: var(--c-app-fill); }
.node .inner { fill: none; stroke-width: 1; }
.node.notion_ds .inner { stroke: var(--c-ds); }
.node.table .inner { stroke: var(--c-table); }

.node text { fill: var(--ink); pointer-events: none; }
.node .name { font: 500 11px var(--font-mono); }
.node .asset-name { font: 600 12px var(--font-sans); }
.node .mono-id { font: 400 9px var(--font-mono); fill: var(--ink-subtle); }
.node.external_app .asset-name { fill: var(--ink-muted); }

/* Statuses */
.node.st-disabled, .node.st-retired { opacity: 0.45; }
.node.st-disabled .shape, .node.st-retired .shape { stroke: var(--c-app); }
.node.st-shelved, .node.st-never-deployed { opacity: 0.6; }
.node.st-shelved .shape, .node.st-never-deployed .shape { stroke-dasharray: 5 4; }
.node .status-dot { fill: var(--ochre); }
.node .status-tag { font: 500 8.5px var(--font-mono); fill: var(--ink-subtle); }
.node .ai-badge rect { fill: var(--c-node-fill); stroke: var(--indigo); stroke-width: 1; }
.node .ai-badge.advanced rect { fill: var(--ochre); stroke: var(--ochre); }
.node .ai-badge text { font: 600 8px var(--font-mono); fill: var(--indigo); }
.node .ai-badge.advanced text { fill: var(--bg); }

/* Hover dimming */
svg.hovering .node, svg.hovering .edge, svg.hovering .edge-glyph { opacity: 0.12; }
svg.hovering .node.hi { opacity: 1; }
svg.hovering .node.hi.st-disabled, svg.hovering .node.hi.st-retired { opacity: 0.65; }
svg.hovering .edge.hi { opacity: 1; }
svg.hovering .edge.hi.reference { opacity: 0.6; }
svg.hovering .hull rect, svg.hovering .hull text { opacity: 0.4; }

/* Semantic zoom */
svg[data-zoom="far"] .node .name,
svg[data-zoom="far"] .node .mono-id,
svg[data-zoom="far"] .status-tag,
svg[data-zoom="far"] .ai-badge,
svg[data-zoom="far"] .node .asset-name.small { display: none; }
svg[data-zoom="far"] .edge { opacity: 0.5; }
svg[data-zoom="far"] .edge.reference { opacity: 0.15; }
svg[data-zoom="mid"] .node .mono-id,
svg[data-zoom="mid"] .status-tag,
svg[data-zoom="mid"] .ai-badge { display: none; }

/* ---------------- Legend ---------------- */
#legend {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 20;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  box-shadow: var(--shadow-sm);
  padding: 10px 12px;
  max-width: 250px;
  font-size: 11px;
  color: var(--ink-muted);
}
#legend h2 {
  margin: 0 0 6px;
  font: 600 10px var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--azure);
}
#legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
#legend svg { flex: none; }
#legend .sect { border-top: 1px solid var(--divider); margin-top: 7px; padding-top: 7px; }
.lgd-toggle {
  font: 500 10px var(--font-sans);
  color: var(--azure);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}
#legend.collapsed .lgd-body { display: none; }
@media (max-width: 760px) { #legend { max-width: 190px; } }

/* ---------------- Detail panel ---------------- */
#panel {
  position: fixed;
  top: 57px;
  right: 0;
  bottom: 0;
  width: 330px;
  max-width: 92vw;
  z-index: 25;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  transform: translateX(105%);
  transition: transform 220ms cubic-bezier(0.2,0.6,0.2,1);
  overflow-y: auto;
  padding: 18px 18px 28px;
}
#panel.open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) {
  #panel { transition: none; }
  .edge, .node .shape, #themeToggle { transition: none; }
}
#panel .close {
  position: absolute;
  top: 10px;
  right: 12px;
  font: 400 16px var(--font-sans);
  line-height: 1;
  color: var(--ink-subtle);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 6px;
}
#panel h2 {
  margin: 4px 0 2px;
  font: 500 14px var(--font-mono);
  letter-spacing: -0.01em;
  word-break: break-all;
  padding-right: 24px;
}
#panel .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.chip {
  font: 500 10px var(--font-sans);
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  color: var(--ink-muted);
  white-space: nowrap;
}
.chip.status-enabled { border-color: var(--azure); color: var(--azure); }
.chip.status-disabled, .chip.status-retired { border-color: var(--border-strong); color: var(--ink-subtle); }
.chip.status-cutover-pending, .chip.warn { border-color: var(--ochre); color: var(--ochre); }
.chip.ai { border-color: var(--indigo); color: var(--indigo); }
.chip.ai.advanced { background: var(--ochre); border-color: var(--ochre); color: var(--bg); }
#panel .desc { font-size: 13px; color: var(--ink-muted); margin: 0 0 4px; }
#panel .desc.clamped { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
#panel .expander {
  font: 500 11.5px var(--font-sans);
  color: var(--azure);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}
#panel .note {
  font-size: 12px;
  color: var(--ochre);
  background: rgba(225, 122, 20, 0.08);
  border-radius: 5px;
  padding: 8px 10px;
  margin: 10px 0;
}
#panel h3 {
  margin: 16px 0 4px;
  font: 600 10px var(--font-sans);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--azure);
}
#panel .meta { font-size: 12px; color: var(--ink-muted); margin: 2px 0; }
#panel .meta .mono, #panel .mono { font-family: var(--font-mono); font-size: 11px; }
.asset-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  font: 400 12.5px var(--font-sans);
  color: var(--ink);
  background: none;
  border: none;
  border-radius: 5px;
  padding: 4px 6px;
  margin: 0 -6px;
  cursor: pointer;
}
.asset-row:hover { background: var(--surface-2); }
.asset-row .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.asset-row .sub { font: 400 10px var(--font-mono); color: var(--ink-subtle); margin-left: auto; }
#panel .gh {
  display: inline-block;
  margin-top: 14px;
  font: 500 12.5px var(--font-sans);
  color: var(--azure);
  text-decoration: underline;
  text-underline-offset: 3px;
}
#panel .gh:hover { opacity: 0.8; }
#panel .dep { border-top: 1px solid var(--divider); padding: 6px 0; font-size: 12px; }
#panel .dep:first-of-type { border-top: none; }
#panel .dep .mono { display: block; }

/* Hint toast */
#hint {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  font-size: 11.5px;
  color: var(--ink-subtle);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 14px;
  box-shadow: var(--shadow-sm);
  pointer-events: none;
  transition: opacity 420ms cubic-bezier(0.2,0.6,0.2,1);
}
#hint.hidden { opacity: 0; }
</style>

  const dx = tx - n.x, dy = ty - n.y;
  const d = Math.hypot(dx, dy) || 1;
  if (isZap(n)) {
    const sx = (ZAP_W / 2 + 4) / Math.abs(dx / d || 1e-9);
    const sy = (ZAP_H / 2 + 4) / Math.abs(dy / d || 1e-9);
    const s = Math.min(sx, sy, d);
    return { x: n.x + (dx / d) * s, y: n.y + (dy / d) * s };
  }
  const r = nodeRadius(n) + 4;
  return { x: n.x + (dx / d) * Math.min(r, d), y: n.y + (dy / d) * Math.min(r, d) };
}

/* ---------------- Render hulls (live: recomputed when nodes are dragged) ---- */
const hullLayer = document.getElementById("hulls");
const hullEls = new Map();
for (const [cluster, h] of Object.entries(DATA.hulls)) {
  const g = el("g", { class: "hull" }, hullLayer);
  g.dataset.cluster = cluster;
  const rect = el("rect", { x: h.x, y: h.y, width: h.w, height: h.h, rx: 16 }, g);
  const t = el("text", { x: h.x + 14, y: h.y - 12 }, g);
  t.textContent = h.label;
  hullEls.set(cluster, { g, rect, text: t });
}
function nodeExtent(n) {
  return isZap(n) ? { dx: 92, dy: 54 } : { dx: n.r + 22, dy: n.r + 26 };
}
function updateHull(cluster) {
  const els = hullEls.get(cluster);
  if (!els) return;
  const members = DATA.nodes.filter((n) => n.cluster === cluster || n.home === cluster);
  if (!members.length) return;
  const minX = Math.min(...members.map((n) => n.x - nodeExtent(n).dx)) - 24;
  const maxX = Math.max(...members.map((n) => n.x + nodeExtent(n).dx)) + 24;
  const minY = Math.min(...members.map((n) => n.y - nodeExtent(n).dy)) - 24;
  const maxY = Math.max(...members.map((n) => n.y + nodeExtent(n).dy)) + 24;
  els.rect.setAttribute("x", minX);
  els.rect.setAttribute("y", minY);
  els.rect.setAttribute("width", maxX - minX);
  els.rect.setAttribute("height", maxY - minY);
  els.text.setAttribute("x", minX + 14);
  els.text.setAttribute("y", minY - 12);
}

/* ---------------- Render edges (live: recomputed when nodes are dragged) ---- */
const edgeLayer = document.getElementById("edges");
const glyphLayer = document.getElementById("glyphs");
const edgeEls = [];
const edgesByNode = new Map();

function updateEdge(rec) {
  const { e, path, glyph, dot } = rec;
  const a = byId.get(e.from), b = byId.get(e.to);
  const pa = anchor(a, b.x, b.y), pb = anchor(b, a.x, a.y);
  const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
  const dx = pb.x - pa.x, dy = pb.y - pa.y;
  const d = Math.hypot(dx, dy) || 1;
  const bow = Math.min(30, d * 0.12);
  const cx = mx - (dy / d) * bow, cy = my + (dx / d) * bow;
  path.setAttribute("d", `M${pa.x},${pa.y} Q${cx},${cy} ${pb.x},${pb.y}`);
  if (dot) { dot.setAttribute("cx", pa.x); dot.setAttribute("cy", pa.y); }
  const t = 0.6;
  const qx = (1 - t) * (1 - t) * pa.x + 2 * (1 - t) * t * cx + t * t * pb.x;
  const qy = (1 - t) * (1 - t) * pa.y + 2 * (1 - t) * t * cy + t * t * pb.y;
  const tanx = 2 * (1 - t) * (cx - pa.x) + 2 * t * (pb.x - cx);
  const tany = 2 * (1 - t) * (cy - pa.y) + 2 * t * (pb.y - cy);
  const ang = (Math.atan2(tany, tanx) * 180) / Math.PI;
  glyph.setAttribute("transform", `translate(${qx},${qy}) rotate(${ang})`);
}

for (const e of DATA.edges) {
  const b = byId.get(e.to);
  let cls = `edge ${e.kind}`;
  if (e.kind === "own") cls += b.kind === "table" ? " to-table" : " to-ds";
  const path = el("path", { class: cls }, edgeLayer);
  const dot = e.kind === "trigger" ? el("circle", { r: 3, class: "edge-dot" }, edgeLayer) : null;
  const glyph = el("path", {
    d: "M-4,-3.5 L4,0 L-4,3.5 Z",
    class: `edge-glyph${e.kind === "http" ? " http" : ""}`,
  }, glyphLayer);
  const rec = { e, path, glyph, dot };
  updateEdge(rec);
  edgeEls.push(rec);
  for (const id of [e.from, e.to]) {
    if (!edgesByNode.has(id)) edgesByNode.set(id, []);
    edgesByNode.get(id).push(rec);
  }
}

/* ---------------- Render nodes ---------------- */
const nodeLayer = document.getElementById("nodes");
const nodeEls = new Map();
for (const n of DATA.nodes) {
  const g = el("g", {
    class: `node ${n.kind} st-${n.status ?? "asset"}`,
    transform: `translate(${n.x},${n.y})`,
    tabindex: "0",
    role: "button",
  }, nodeLayer);
  g.dataset.id = n.id;
  nodeEls.set(n.id, g);

  if (isZap(n)) {
    el("rect", { class: "shape", x: -ZAP_W / 2, y: -ZAP_H / 2, width: ZAP_W, height: ZAP_H, rx: 5 }, g);
    const lines = wrapName(n.label);
    const t = el("text", { class: "name", "text-anchor": "middle" }, g);
    const y0 = -((lines.length - 1) / 2) * 12;
    lines.forEach((line, i) => {
      const ts = el("tspan", { x: 0, y: y0 + i * 12 + 4 }, t);
      ts.textContent = line;
    });
    if (n.status === "cutover-pending") el("circle", { class: "status-dot", cx: ZAP_W / 2 - 8, cy: -ZAP_H / 2 + 8, r: 4 }, g);
    if (n.status === "retired" || n.status === "shelved" || n.status === "never-deployed" || n.kind === "classic") {
      const tag = el("text", { class: "status-tag", x: 0, y: ZAP_H / 2 + 12, "text-anchor": "middle" }, g);
      tag.textContent = n.kind === "classic" ? "classic code step" : n.status;
    }
    if (n.ai) {
      const adv = (n.ai.tier || "").startsWith("advanced");
      const b = el("g", { class: `ai-badge${adv ? " advanced" : ""}`, transform: `translate(${-ZAP_W / 2 + 2},${-ZAP_H / 2 - 8})` }, g);
      el("rect", { x: 0, y: -8, width: 20, height: 13, rx: 3 }, b);
      const bt = el("text", { x: 10, y: 2, "text-anchor": "middle" }, b);
      bt.textContent = "AI";
    }
  } else {
    const r = nodeRadius(n);
    if (n.kind === "notion_ds") {
      el("circle", { class: "shape", r }, g);
      if (n.external_owner) el("circle", { class: "inner", r: r - 4 }, g);
    } else if (n.kind === "table") {
      const w = r * 2.1, h = r * 1.25;
      el("rect", { class: "shape", x: -w / 2, y: -h / 2, width: w, height: h, rx: 4 }, g);
      el("line", { class: "ledger", x1: -w / 2, y1: -h / 2, x2: w / 2, y2: -h / 2 }, g);
      if (n.external_owner) el("rect", { class: "inner", x: -w / 2 + 3.5, y: -h / 2 + 3.5, width: w - 7, height: h - 7, rx: 2 }, g);
    } else if (n.kind === "drive_folder") {
      const w = r * 1.9, h = r * 1.15;
      el("path", {
        class: "shape",
        d: `M${-w / 2},${-h / 2 + 6} l0,-6 l${w * 0.32},0 l6,6 l${w * 0.68 - 6},0 l0,${h} l${-w},0 Z`,
      }, g);
    } else {
      const w = r * 2.2, h = 30;
      el("rect", { class: "shape", x: -w / 2, y: -h / 2, width: w, height: h, rx: 15 }, g);
    }
    const label = el("text", { class: `asset-name${n.degree < 4 ? " small" : ""}`, "text-anchor": "middle", y: n.kind === "notion_ds" ? 4 : 4 }, g);
    // Wrap asset names at ~14 chars over up to 2 lines.
    const words = n.label.split(" ");
    let l1 = "", l2 = "";
    for (const w of words) (l1.length + w.length <= 13 && !l2 ? (l1 = l1 ? l1 + " " + w : w) : (l2 = l2 ? l2 + " " + w : w));
    if (l2) {
      label.setAttribute("y", -2);
      const t1 = el("tspan", { x: 0 }, label); t1.textContent = l1;
      const t2 = el("tspan", { x: 0, dy: 13 }, label); t2.textContent = l2.length > 16 ? l2.slice(0, 15) + "…" : l2;
    } else label.textContent = l1;
    if (n.kind === "table" && n.asset_id) {
      const idt = el("text", { class: "mono-id", "text-anchor": "middle", y: nodeRadius(n) * 0.625 + 12 }, g);
      idt.textContent = n.asset_id;
    }
  }
}

/* ---------------- Adjacency (hover) ---------------- */
const adj = new Map();
for (const { e } of edgeEls) {
  if (!adj.has(e.from)) adj.set(e.from, new Set());
  if (!adj.has(e.to)) adj.set(e.to, new Set());
  adj.get(e.from).add(e.to);
  adj.get(e.to).add(e.from);
}
function setHover(id) {
  if (!id) {
    svg.classList.remove("hovering");
    for (const g of nodeEls.values()) g.classList.remove("hi");
    for (const { path, glyph } of edgeEls) { path.classList.remove("hi"); glyph.classList.remove("hi"); }
    return;
  }
  svg.classList.add("hovering");
  const hood = new Set([id, ...(adj.get(id) ?? [])]);
  for (const [nid, g] of nodeEls) g.classList.toggle("hi", hood.has(nid));
  for (const { e, path, glyph } of edgeEls) {
    const on = e.from === id || e.to === id;
    path.classList.toggle("hi", on);
    glyph.classList.toggle("hi", on);
  }
}
/* ---------------- Topic-box (hull) dragging: moves the whole cluster ------- */
const hullMembers = (cluster) =>
  DATA.nodes.filter((n) => n.cluster === cluster || n.home === cluster);
let hullDrag = null;
hullLayer.addEventListener("pointerdown", (ev) => {
  const g = ev.target.closest(".hull");
  if (!g) return;
  const cluster = g.dataset.cluster;
  hullDrag = {
    cluster,
    g,
    startX: ev.clientX,
    startY: ev.clientY,
    starts: hullMembers(cluster).map((n) => [n, n.x, n.y]),
  };
  g.setPointerCapture(ev.pointerId);
  g.classList.add("dragging");
  ev.stopPropagation();
});
hullLayer.addEventListener("pointermove", (ev) => {
  if (!hullDrag) return;
  const dx = (ev.clientX - hullDrag.startX) / view.k;
  const dy = (ev.clientY - hullDrag.startY) / view.k;
  const touched = new Set();
  for (const [n, x0, y0] of hullDrag.starts) {
    n.x = x0 + dx;
    n.y = y0 + dy;
    nodeEls.get(n.id).setAttribute("transform", `translate(${n.x},${n.y})`);
    for (const rec of edgesByNode.get(n.id) ?? []) touched.add(rec);
  }
  for (const rec of touched) updateEdge(rec);
  updateHull(hullDrag.cluster);
});
const endHullDrag = (ev) => {
  if (!hullDrag) return;
  hullDrag.g.releasePointerCapture?.(ev.pointerId);
  hullDrag.g.classList.remove("dragging");
  hullDrag = null;
};
hullLayer.addEventListener("pointerup", endHullDrag);
hullLayer.addEventListener("pointercancel", endHullDrag);

/* ---------------- Node dragging ---------------- */
let drag = null;
let suppressClick = false;
nodeLayer.addEventListener("pointerdown", (ev) => {
  const g = ev.target.closest(".node");
  if (!g) return;
  const n = byId.get(g.dataset.id);
  drag = { n, g, startX: ev.clientX, startY: ev.clientY, nx: n.x, ny: n.y, moved: false };
  g.setPointerCapture(ev.pointerId);
  ev.stopPropagation();
});
nodeLayer.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const dxc = ev.clientX - drag.startX, dyc = ev.clientY - drag.startY;
  if (!drag.moved && Math.hypot(dxc, dyc) < 4) return;
  if (!drag.moved) setHover(null); // dragging is rearranging, not inspecting
  drag.moved = true;
  const n = drag.n;
  n.x = drag.nx + dxc / view.k;
  n.y = drag.ny + dyc / view.k;
  drag.g.setAttribute("transform", `translate(${n.x},${n.y})`);
  for (const rec of edgesByNode.get(n.id) ?? []) updateEdge(rec);
  updateHull(n.cluster ?? n.home);
});
const endDrag = (ev) => {
  if (!drag) return;
  if (drag.moved) suppressClick = true;
  drag.g.releasePointerCapture?.(ev.pointerId);
  drag = null;
};
nodeLayer.addEventListener("pointerup", endDrag);
nodeLayer.addEventListener("pointercancel", endDrag);

nodeLayer.addEventListener("pointerover", (ev) => {
  const g = ev.target.closest(".node");
  if (g) setHover(g.dataset.id);
});
nodeLayer.addEventListener("pointerout", (ev) => {
  if (!ev.relatedTarget?.closest?.(".node")) setHover(null);
});

/* ---------------- Pan / zoom ---------------- */
let view = { x: 0, y: 0, k: 1 };
function applyView() {
  if (![view.x, view.y, view.k].every(Number.isFinite) || view.k <= 0) return;
  viewport.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
  svg.dataset.zoom = view.k < 0.55 ? "far" : view.k < 1.1 ? "mid" : "near";
  // Hull titles hold ~26px on screen when zoomed out (capped in map units).
  svg.style.setProperty("--hull-font", `${Math.min(72, 26 / Math.min(1, view.k))}px`);
}
function fitAll(pad = 60) {
  const xs = DATA.nodes.map((n) => n.x), ys = DATA.nodes.map((n) => n.y);
  const minX = Math.min(...xs) - 160, maxX = Math.max(...xs) + 160;
  const minY = Math.min(...ys) - 120, maxY = Math.max(...ys) + 120;
  const W = stage.clientWidth, H = stage.clientHeight;
  const k = Math.min(W / (maxX - minX + pad), H / (maxY - minY + pad));
  view = {
    k,
    x: W / 2 - ((minX + maxX) / 2) * k,
    y: H / 2 + 20 - ((minY + maxY) / 2) * k,
  };
  applyView();
}
stage.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  // Trackpad two-finger scroll pans; pinch arrives as wheel+ctrlKey and zooms
  // (mouse wheels zoom too via the same gesture with ctrl/cmd held).
  if (!ev.ctrlKey && !ev.metaKey) {
    view.x -= ev.deltaX;
    view.y -= ev.deltaY;
    applyView();
    return;
  }
  const factor = Math.exp(-ev.deltaY * 0.005);
  const k = Math.min(3.5, Math.max(0.2, view.k * factor));
  const rect = stage.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  view.x = px - ((px - view.x) / view.k) * k;
  view.y = py - ((py - view.y) / view.k) * k;
  view.k = k;
  applyView();
}, { passive: false });

const pointers = new Map();
let pinchStart = null;
stage.addEventListener("pointerdown", (ev) => {
  if (ev.target.closest(".node") || ev.target.closest(".hull")) return;
  stage.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pointers.size === 2) {
    const [p1, p2] = [...pointers.values()];
    pinchStart = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), k: view.k };
  }
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", (ev) => {
  const p = pointers.get(ev.pointerId);
  if (!p) return;
  if (pointers.size === 2 && pinchStart) {
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    const [p1, p2] = [...pointers.values()];
    const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    const k = Math.min(3.5, Math.max(0.2, pinchStart.k * (d / pinchStart.d)));
    const rect = stage.getBoundingClientRect();
    const cxp = (p1.x + p2.x) / 2 - rect.left, cyp = (p1.y + p2.y) / 2 - rect.top;
    view.x = cxp - ((cxp - view.x) / view.k) * k;
    view.y = cyp - ((cyp - view.y) / view.k) * k;
    view.k = k;
    applyView();
    return;
  }
  view.x += ev.clientX - p.x;
  view.y += ev.clientY - p.y;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  applyView();
});
const endPointer = (ev) => {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (!pointers.size) stage.classList.remove("panning");
};
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

function flyTo(n, k = 1.4) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const panelW = panel.classList.contains("open") ? 330 : 0;
  view = { k, x: (W - panelW) / 2 - n.x * k, y: H / 2 - n.y * k };
  applyView();
}

/* ---------------- Detail panel ---------------- */
const panel = document.getElementById("panel");
let selected = null;
const KIND_LABEL = {
  durable: "Durable workflow", classic: "Classic Zap", table: "Zapier Table",
  notion_ds: "Notion data source", drive_folder: "Drive folder", external_app: "External app",
};
const KIND_COLOR = {
  durable: "var(--c-durable)", classic: "var(--c-app)", table: "var(--c-table)",
  notion_ds: "var(--c-ds)", drive_folder: "var(--c-folder)", external_app: "var(--c-app)",
};
const EDGE_GROUPS = [
  ["own", "Owns", "out"], ["write", "Writes", "out"], ["read", "Reads", "in"],
  ["trigger", "Triggered by", "in"], ["reference", "References", "out"], ["http", "Calls over HTTP", "out"],
];
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function relationRows(node) {
  const rows = [];
  for (const [kind, headOut, dir] of EDGE_GROUPS) {
    const partners = [];
    for (const { e } of edgeEls) {
      if (e.kind !== kind) continue;
      if (e.from === node.id) partners.push({ other: byId.get(e.to), out: true });
      else if (e.to === node.id) partners.push({ other: byId.get(e.from), out: false });
    }
    if (!partners.length) continue;
    // For assets, flip the heading to read from the asset's side.
    const outs = partners.filter((p) => p.out).map((p) => p.other);
    const ins = partners.filter((p) => !p.out).map((p) => p.other);
    const sections = [];
    if (isZap(node)) {
      if (kind === "trigger") sections.push([ins.length ? "Triggered by" : null, ins], ["Triggers", outs]);
      else if (kind === "read") sections.push(["Reads", ins], ["Read by", outs]);
      else if (kind === "http") sections.push(["Calls over HTTP", outs], ["Called over HTTP by", ins]);
      else sections.push([headOut, outs], [`${headOut === "Owns" ? "Owned" : headOut === "Writes" ? "Written" : "Referenced"} by`, ins]);
    } else {
      if (kind === "own") sections.push(["Owned by", ins]);
      else if (kind === "write") sections.push(["Written by", ins], ["Writes", outs]);
      else if (kind === "read") sections.push(["Read by", outs], ["Reads from", ins]);
      else if (kind === "trigger") sections.push(["Triggers", outs], ["Triggered by", ins]);
      else if (kind === "reference") sections.push(["Referenced by", ins]);
      else sections.push(["HTTP", [...outs, ...ins]]);
    }
    for (const [head, list] of sections) {
      if (!head || !list.length) continue;
      rows.push(`<h3>${esc(head)}</h3>` + list.map((o) =>
        `<button class="asset-row" data-goto="${esc(o.id)}"><span class="dot" style="background:${KIND_COLOR[o.kind]}"></span>` +
        `<span>${esc(o.label)}</span><span class="sub">${esc(KIND_LABEL[o.kind])}</span></button>`).join(""));
    }
  }
  return rows.join("");
}

function openPanel(node) {
  selected = node.id;
  for (const [id, g] of nodeEls) g.classList.toggle("selected", id === node.id);
  let html = `<button class="close" aria-label="Close">✕</button>`;
  html += `<h2>${esc(node.label)}</h2><div class="chips">`;
  html += `<span class="chip" style="border-color:${KIND_COLOR[node.kind]};color:${KIND_COLOR[node.kind]}">${esc(KIND_LABEL[node.kind])}</span>`;
  if (node.status && node.status !== "asset") html += `<span class="chip status-${esc(node.status)}">${esc(node.status)}</span>`;
  if (node.cluster && DATA.hulls[node.cluster]) html += `<span class="chip">${esc(DATA.hulls[node.cluster].label)}</span>`;
  if (node.ai) {
    const adv = (node.ai.tier || "").startsWith("advanced");
    html += `<span class="chip ai${adv ? " advanced" : ""}">AI · ${esc(node.ai.tier ?? "step")}</span>`;
  }
  if (node.external_owner) html += `<span class="chip warn">externally owned</span>`;
  if (node.legacy) html += `<span class="chip warn">legacy</span>`;
  html += `</div>`;
  if (node.description) {
    const long = node.description.length > 260;
    html += `<p class="desc${long ? " clamped" : ""}">${esc(node.description)}</p>`;
    if (long) html += `<button class="expander">Show more</button>`;
  }
  if (node.status_note || node.note) html += `<div class="note">${esc(node.status_note ?? node.note)}</div>`;
  if (node.asset_id) html += `<p class="meta">id <span class="mono">${esc(node.asset_id)}</span></p>`;
  if (node.external_owner) html += `<p class="meta">Owner: ${esc(node.external_owner)}</p>`;
  if (node.trigger_app) html += `<p class="meta">Trigger app: <span class="mono">${esc(node.trigger_app)}</span></p>`;
  if (node.deployments?.length > 1) {
    html += `<h3>Deployments (${node.deployments.length})</h3>`;
    for (const d of node.deployments) {
      html += `<div class="dep"><span class="mono">${esc(d.name)}</span>` +
        `${d.enabled ? "" : `<span class="chip status-disabled" style="margin-left:6px">disabled</span>`}` +
        `${d.description ? `<span style="color:var(--ink-muted)">${esc(d.description)}</span>` : ""}</div>`;
    }
  }
  html += relationRows(node);
  if (isZap(node)) html += `<a class="gh" href="${esc(node.github)}" target="_blank" rel="noopener">View source on GitHub →</a>`;
  panel.innerHTML = html;
  panel.classList.add("open");
  panel.scrollTop = 0;
}
function closePanel() {
  panel.classList.remove("open");
  selected = null;
  for (const g of nodeEls.values()) g.classList.remove("selected");
}
panel.addEventListener("click", (ev) => {
  if (ev.target.closest(".close")) return closePanel();
  const exp = ev.target.closest(".expander");
  if (exp) {
    const d = panel.querySelector(".desc");
    const clamped = d.classList.toggle("clamped");
    exp.textContent = clamped ? "Show more" : "Show less";
    return;
  }
  const go = ev.target.closest("[data-goto]");
  if (go) {
    const n = byId.get(go.dataset.goto);
    if (n) { openPanel(n); flyTo(n); setHover(null); }
  }
});
nodeLayer.addEventListener("click", (ev) => {
  if (suppressClick) { suppressClick = false; return; }
  const g = ev.target.closest(".node");
  if (g) openPanel(byId.get(g.dataset.id));
});
nodeLayer.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" || ev.key === " ") {
    const g = ev.target.closest(".node");
    if (g) { ev.preventDefault(); openPanel(byId.get(g.dataset.id)); }
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") closePanel();
});

/* ---------------- Legend ---------------- */

  const sw = (inner) => `<svg width="26" height="18" viewBox="0 0 26 18">${inner}</svg>`;
  const rows = [
    [sw(`<rect x="2" y="3" width="22" height="12" rx="3" fill="var(--c-node-fill)" stroke="var(--c-durable)" stroke-width="1.5"/>`), "Durable workflow"],
    [sw(`<rect x="3" y="3" width="20" height="12" rx="2" fill="var(--c-table-fill)" stroke="var(--c-table)" stroke-width="1.5"/><line x1="3" y1="3" x2="23" y2="3" stroke="var(--c-table)" stroke-width="2.5"/>`), "Zapier Table"],
    [sw(`<circle cx="13" cy="9" r="7" fill="var(--c-ds-fill)" stroke="var(--c-ds)" stroke-width="1.5"/>`), "Notion data source"],
    [sw(`<path d="M4,6 l0,-2 l6,0 l2,2 l10,0 l0,10 l-18,0 Z" fill="var(--c-folder-fill)" stroke="var(--c-folder)" stroke-width="1.5"/>`), "Drive folder"],
    [sw(`<rect x="2" y="4" width="22" height="10" rx="5" fill="var(--c-app-fill)" stroke="var(--c-app)" stroke-width="1.2"/>`), "External app"],
  ];
  const edges = [
    [sw(`<line x1="2" y1="9" x2="24" y2="9" stroke="var(--c-edge)" stroke-width="1.5"/>`), "writes →"],
    [sw(`<line x1="2" y1="9" x2="24" y2="9" stroke="var(--c-edge-read)" stroke-width="1"/>`), "reads"],
    [sw(`<line x1="2" y1="9" x2="24" y2="9" stroke="var(--c-table)" stroke-width="2.5"/>`), "owns"],
    [sw(`<circle cx="4" cy="9" r="2.5" fill="var(--azure)"/><line x1="7" y1="9" x2="24" y2="9" stroke="var(--azure)" stroke-width="1.25"/>`), "triggers"],
    [sw(`<line x1="2" y1="9" x2="24" y2="9" stroke="var(--c-edge)" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>`), "reference only"],
    [sw(`<line x1="2" y1="9" x2="24" y2="9" stroke="var(--ochre)" stroke-width="2"/>`), "Zap → Zap HTTP"],
  ];
  const status = [
    [sw(`<rect x="2" y="3" width="22" height="12" rx="3" fill="var(--c-node-fill)" stroke="var(--c-durable)" stroke-width="1.5" opacity="0.45"/>`), "disabled / retired"],
    [sw(`<rect x="2" y="3" width="22" height="12" rx="3" fill="var(--c-node-fill)" stroke="var(--c-durable)" stroke-width="1.5"/><circle cx="21" cy="6" r="3" fill="var(--ochre)"/>`), "cutover pending"],
    [sw(`<circle cx="13" cy="9" r="7" fill="none" stroke="var(--c-table)" stroke-width="1.5"/><circle cx="13" cy="9" r="4.5" fill="none" stroke="var(--c-table)" stroke-width="1"/>`), "externally owned"],
  ];
  const html = (list) => list.map(([icon, label]) => `<div class="row">${icon}<span>${label}</span></div>`).join("");
  document.getElementById("legendBody").innerHTML =
    `<h2>Nodes</h2>${html(rows)}<div class="sect"><h2>Edges</h2>${html(edges)}</div><div class="sect"><h2>Status</h2>${html(status)}</div>`;
  const toggle = document.getElementById("legendToggle");
  toggle.addEventListener("click", () => {
    const collapsed = document.getElementById("legend").classList.toggle("collapsed");
    toggle.textContent = collapsed ? "Legend ▸" : "Legend ▾";
    toggle.setAttribute("aria-expanded", String(!collapsed));
  });
})();

/* ---------------- Theme toggle (system → light → dark) ---------------- */
(() => {
  const btn = document.getElementById("themeToggle");
  const states = ["system", "light", "dark"];
  let i = 0;
  btn.addEventListener("click", () => {
    i = (i + 1) % states.length;
    const s = states[i];
    if (s === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", s);
    btn.textContent = `Theme: ${s}`;
  });
})();

/* ---------------- Boot ---------------- */
fitAll();
window.addEventListener("resize", () => fitAll());
// Stage dimensions can be 0 while the host lays the page out; retry once real.
if (!stage.clientWidth) requestAnimationFrame(() => fitAll());
setTimeout(() => document.getElementById("hint").classList.add("hidden"), 6000);
</script>
