# Publish Zaps — DRY RUN
#
# When a pull request is merged into `main`, this workflow figures out which Zap
# directories the PR changed and reports which deployed workflows *would* be
# republished to Zapier. It does NOT publish anything and needs no Zapier
# credentials — it only reads the repo and writes a report.
#
# This is the safe first stage. Once the detection is trusted, a follow-up
# workflow can reuse the same detection script (scripts/detect-changed-zaps.mjs)
# to actually run `publish-workflow-version`, gated behind a GitHub Environment
# approval and authenticated with Zapier client credentials stored as secrets.

name: Publish Zaps (dry run)

# `pull_request: closed` fires when a PR closes; the job below filters to only
# those that were actually *merged* (not just closed without merging).
on:
  pull_request:
    types: [closed]
    branches: [main]

# Least privilege: read the code, and write PR comments so the report is posted
# back onto the merged PR. No other access is granted.
permissions:
  contents: read
  pull-requests: write

jobs:
  dry-run:
    # Skip PRs that were closed without merging.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Full history so we can diff the PR's base commit against its head.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect affected Zaps (dry run)
        id: detect
        env:
          # These two commits bracket exactly what the PR changed, regardless of
          # whether it was merged, squashed, or rebased.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The script appends its Markdown report to the run's Step Summary via
          # $GITHUB_STEP_SUMMARY, and we also capture it to a file to post as a
          # PR comment in the next step.
          node scripts/detect-changed-zaps.mjs --base "$BASE_SHA" --head "$HEAD_SHA" | tee report.md

      - name: Post the dry-run report as a PR comment
        # Never let a comment-permission hiccup fail the run — the Step Summary
        # already carries the report regardless.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file report.md
