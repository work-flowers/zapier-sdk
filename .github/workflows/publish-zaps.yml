# Publish Zaps on merge
#
# When a PR merges into `main`, this workflow:
#   1. detect  — reports which deployed workflows the PR affects (a comment on
#                the PR + the run Step Summary). No credentials, no side effects.
#   2. publish — publishes each affected deployment to Zapier and syncs the new
#                current_version_id back into zap.json (repo rule 4). A Zap
#                marked deploy.state "pending-create" is CREATED and gets its v1
#                published here, with workflow_id / trigger_url synced back too.
#                Merging the PR is the approval: this job runs automatically on
#                merge, with no separate environment gate. (There used to be a
#                `production` environment with a required-reviewer rule here; it
#                was removed 2026-08-18 as redundant with the act of merging.)
#                The sync-back also carries a regenerated docs/map.html — see the
#                note on that step for why it has to.
#
# ┌─ SETUP NOTES ───────────────────────────────────────────────────────────────┐
# │ Secrets: the existing repository secrets ZAPIER_CLIENT_ID /                 │
# │ ZAPIER_CLIENT_SECRET are read as-is here — leave them as repo secrets so    │
# │ the verify-zapier-credentials workflow keeps working.                       │
# │                                                                             │
# │ Also: allow the Actions bot to push the zap.json sync-back to `main`. If    │
# │ `main` is protected, add an exception for github-actions[bot], or the       │
# │ sync-back step fails (the publish itself still succeeds).                   │
# └─────────────────────────────────────────────────────────────────────────────┘

name: Publish Zaps

on:
  pull_request:
    types: [closed]
    branches: [main]

# Serialize publishes so two quick merges can't race on pushing zap.json to main.
concurrency:
  group: publish-zaps
  cancel-in-progress: false

jobs:
  # ── 1. Detect + report (ungated, no secrets) ────────────────────────────────
  detect:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_changes: ${{ steps.decide.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Derive the PR's changed files from the API — correct regardless of
      # whether the PR was merge-committed, squashed, or rebased.
      - name: List changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' > changed.txt
          echo "Changed files:"; cat changed.txt

      - name: Report affected Zaps
        run: |
          mapfile -t FILES < changed.txt
          node scripts/detect-changed-zaps.mjs --files "${FILES[@]}" | tee report.md

      - name: Decide whether anything needs publishing
        id: decide
        run: |
          mapfile -t FILES < changed.txt
          node scripts/detect-changed-zaps.mjs --files "${FILES[@]}" --json > detect.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("detect.json","utf8"));
            const any = d.results.some(r => r.kind === "durable" && r.wouldRepublish);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "has_changes=" + any + "\n");
            console.log("has_changes =", any);
          '

      - name: Comment the report on the PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file report.md

  # ── 2. Publish (runs automatically — merging the PR is the approval) ─────────
  publish:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write         # to push the zap.json sync-back to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --json files --jq '.files[].path' > changed.txt

      - name: Publish affected Zaps and sync zap.json
        env:
          ZAPIER_CLIENT_ID: ${{ secrets.ZAPIER_CLIENT_ID }}
          ZAPIER_CLIENT_SECRET: ${{ secrets.ZAPIER_CLIENT_SECRET }}
        run: |
          mapfile -t FILES < changed.txt
          node scripts/publish-changed-zaps.mjs --files "${FILES[@]}" --execute

      # The workflow map's data block is DERIVED from zap.json — including
      # workflow_id and enabled, both of which the sync-back above can change. A
      # first publish is the sharp case: a "pending-create" zap.json has
      # workflow_id null, which build-map reads as "not deployed", so filling the
      # ids in silently makes the committed map stale. Regenerating here, in the same
      # commit as the zap.json changes that caused it, is what keeps `main` green
      # for the check-map PR gate — which never sees this commit, because the
      # sync-back is [skip ci].
      - name: Regenerate the workflow map
        run: node scripts/build-map.mjs

      - name: Commit the sync-back
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- '**/zap.json' docs/map.html; then
            echo "Nothing to sync back."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '**/zap.json' docs/map.html
          git commit -m "Sync current_version_id and workflow map after publishing (PR #${PR_NUMBER}) [skip ci]"
          git push origin HEAD:main
