# Verify Zapier credentials
#
# A read-only smoke test for the CI machine credentials (ZAPIER_CLIENT_ID /
# ZAPIER_CLIENT_SECRET). Run it by hand from the Actions tab ("Run workflow")
# whenever you set up or rotate the secrets.
#
# It authenticates with the client credentials and lists durable workflows —
# the SAME experimental surface that publishing uses, but read-only. If the
# credentials are missing, wrong, or lack the scope to reach the durables API,
# this fails immediately and visibly, instead of that being discovered mid-
# deploy on a real merge. It publishes nothing and changes nothing.

name: Verify Zapier credentials

# Manual trigger only. A workflow_dispatch workflow shows its "Run workflow"
# button in the Actions tab once it lives on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the secrets are present
        env:
          ZAPIER_CLIENT_ID: ${{ secrets.ZAPIER_CLIENT_ID }}
          ZAPIER_CLIENT_SECRET: ${{ secrets.ZAPIER_CLIENT_SECRET }}
        run: |
          missing=""
          [ -z "$ZAPIER_CLIENT_ID" ]     && missing="$missing ZAPIER_CLIENT_ID"
          [ -z "$ZAPIER_CLIENT_SECRET" ] && missing="$missing ZAPIER_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "❌ Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Both secrets are present (values are masked in logs)."

      - name: List durable workflows (read-only auth check)
        env:
          ZAPIER_CLIENT_ID: ${{ secrets.ZAPIER_CLIENT_ID }}
          ZAPIER_CLIENT_SECRET: ${{ secrets.ZAPIER_CLIENT_SECRET }}
        run: |
          set -o pipefail
          # Same experimental surface publishing uses — but this only reads.
          # The CLI ships in the @zapier/zapier-sdk-cli package (bin: zapier-sdk).
          # `npx zapier-sdk` alone only works where that package is already
          # installed; on a clean runner we must name the package for npx.
          npx --yes --package @zapier/zapier-sdk-cli \
            zapier-sdk --experimental list-workflows --json \
            --credentials-client-id "$ZAPIER_CLIENT_ID" \
            --credentials-client-secret "$ZAPIER_CLIENT_SECRET" > workflows.json

          # Print only a count and a verdict — not the raw list — to keep
          # workflow metadata out of the run logs.
          node -e '
            const raw = require("fs").readFileSync("workflows.json", "utf8");
            const d = JSON.parse(raw);
            const arr = Array.isArray(d) ? d : (d.data || d.workflows || d.results || []);
            const n = Array.isArray(arr) ? arr.length : "unknown";
            console.log("✅ Auth OK — the CI credentials can reach the durables API.");
            console.log("Durable workflows visible to these credentials:", n);
            console.log("");
            console.log("Note: this proves authentication + read access. The final");
            console.log("proof of publish rights is a real (approval-gated) republish.");
          '

      - name: Summary
        if: always()
        run: |
          {
            echo "## Zapier credential check"
            if [ "${{ job.status }}" = "success" ]; then
              echo ""
              echo "✅ **Passed** — \`ZAPIER_CLIENT_ID\` / \`ZAPIER_CLIENT_SECRET\` authenticate and can read the durables API."
            else
              echo ""
              echo "❌ **Failed** — see the step logs above. Common causes: a missing or mistyped secret, or credentials minted without a scope that reaches the durables API (re-mint with \`--allowed-scopes\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
