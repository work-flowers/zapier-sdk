# Check the workflow map's curation
#
# `docs/map.html` carries a generated data block built from the repo's zap.json /
# workflow sources merged with the curated semantics in `docs/map-overlay.json`
# (see scripts/build-map.mjs). The data block itself is regenerated DAILY by
# refresh-map.yml, not per PR — so this gate does not care whether the committed
# map is current.
#
# What it does check is the part only a human can supply: the overlay. `--validate`
# never writes; it fails when the repo and the overlay disagree (unregistered
# asset ids, a zap dir in no cluster, a zap touching an asset with no curated
# edge). Those would make the daily refresh refuse, so they have to be fixed in
# the PR that introduces them, not discovered by the next scheduled run.
#
# It runs on PULL REQUESTS, deliberately: this has to block before the merge,
# not report after it.
#
# No secrets, no network, no permissions beyond reading the repo — build-map.mjs
# is pure filesystem reads. Safe to make a required status check.

name: Check map

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No path filter on purpose: curation drift can be introduced by adding a
      # Zap directory, editing an overlay entry, or a workflow.ts / zap.json
      # picking up a new asset id — filtering paths would let some through. The script
      # takes a couple of seconds, so it just always runs.
      - name: Verify docs/map-overlay.json matches the repo
        id: check
        run: |
          set -o pipefail
          node scripts/build-map.mjs --validate 2>&1 | tee map-check.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Workflow map"
            echo ""
            if [ "${{ steps.check.outcome }}" = "success" ]; then
              echo "✅ \`docs/map-overlay.json\` is consistent with the repo. (The map itself refreshes daily.)"
            else
              echo "❌ **The map overlay is out of step with the repo.** Update"
              echo "\`docs/map-overlay.json\` — register the asset id, place the zap in a"
              echo "cluster, or add the missing edge — then re-run:"
              echo ""
              echo '```bash'
              echo "node scripts/build-map.mjs --validate"
              echo '```'
              echo ""
              echo "See the \`zap-map\` skill."
              echo ""
              echo "<details><summary>Checker output</summary>"
              echo ""
              echo '```'
              cat map-check.txt 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
