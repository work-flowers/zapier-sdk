# Sync the shared durables rules from the template repo
#
# `.claude/rules/*.md` are the universal half of this repo's Claude Code
# instructions — publish pipeline, trigger handling, the determinism guard, the
# empty-ping guard, AI tiers, concurrency. It is deliberately BYTE-IDENTICAL
# across every Zap repo so a lesson learned in one reaches all of them.
#
# This job checks the template's copy daily and opens a PR when it differs.
# Daily doesn't mean a PR a day: `create-pull-request` reuses the fixed branch
# `chore/sync-shared-rules`, so a run with new changes UPDATES the open PR
# rather than opening another. An unchanged day exits before that step.
#
# ┌─ WHY A PR AND NOT AN AUTO-COMMIT ───────────────────────────────────────────┐
# │ These rules govern how durables reach PRODUCTION. A human reads the diff    │
# │ before it lands. Glance and merge is fine; silent auto-commit is not.       │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# NO CREDENTIAL NEEDED. The template repo is public, so the runner's built-in
# GITHUB_TOKEN can read it — nothing to expire, nothing for an org to approve.
# A `TEMPLATE_SYNC_TOKEN` secret is still honoured if one exists, so making the
# template private again is a secret away rather than a workflow edit.
#
# ┌─ THIS JOB USED TO FAIL SILENTLY, AND DID ───────────────────────────────────┐
# │ Every early exit here once wrote its reason to the step summary and exited  │
# │ 0, so a misconfigured sync looked exactly like a quiet, healthy day. In     │
# │ knoxx-code-zaps it ran daily for weeks against a missing token, skipping    │
# │ its own Compare step every time, and nobody noticed until the two repos'    │
# │ rules had visibly diverged. Every abnormal path now annotates and FAILS.    │
# │ The protective refusals (empty listing, empty file) fail too: each one      │
# │ means something is wrong upstream, not that there is nothing to do.         │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Merging this PR does NOT deploy anything: no Zap source changes, so
# `Publish Zaps` has nothing to republish.

name: Sync shared rules

on:
  schedule:
    # Daily at 03:00 UTC (11:00 Singapore), an hour after the skills refresh so
    # the two never contend for the same runner minute.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-shared-rules
  cancel-in-progress: false

env:
  UPSTREAM_REPO: work-flowers/zapier-durables-template
  # The whole directory, not one file — the shared rules are a SET
  # (durables.md + durables-sdk.md), and a new one can be added upstream.
  RULES_DIR: .claude/rules

jobs:
  sync:
    runs-on: ubuntu-latest
    # The template is the upstream; it must not try to sync from itself.
    if: github.repository != 'work-flowers/zapier-durables-template'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream copy
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          die() {
            echo "::error::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          rm -rf /tmp/upstream-rules && mkdir -p /tmp/upstream-rules
          if ! gh api "repos/$UPSTREAM_REPO/contents/$RULES_DIR" --jq '.[] | select(.name|endswith(".md")) | .name' > /tmp/names.txt; then
            die "Could not list $RULES_DIR in $UPSTREAM_REPO — check the repo is still public and the path still exists."
          fi
          # An empty listing must never be read as "upstream deleted everything".
          if [ ! -s /tmp/names.txt ]; then
            die "Upstream listed no rules files — refusing to wipe local rules."
          fi
          while read -r n; do
            [ -z "$n" ] && continue
            gh api "repos/$UPSTREAM_REPO/contents/$RULES_DIR/$n" \
              -H "Accept: application/vnd.github.raw" > "/tmp/upstream-rules/$n" \
              || die "Failed fetching $n from $UPSTREAM_REPO."
            # A truncated or empty file must never overwrite good local rules.
            [ -s "/tmp/upstream-rules/$n" ] || die "Upstream $n was empty — refusing to overwrite."
          done < /tmp/names.txt
          echo "Fetched from $UPSTREAM_REPO: $(tr '\n' ' ' < /tmp/names.txt)"

      - name: Compare
        id: diff
        run: |
          mkdir -p "$RULES_DIR"
          if diff -rq /tmp/upstream-rules "$RULES_DIR" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Shared rules already match \`$UPSTREAM_REPO\`."
            echo "Shared rules already match \`$UPSTREAM_REPO\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rm -f "$RULES_DIR"/*.md
          cp /tmp/upstream-rules/*.md "$RULES_DIR"/
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Shared rules differ from $UPSTREAM_REPO — opening/updating a PR."
          {
            echo "## Shared rules changed"
            echo
            echo "Upstream: \`$UPSTREAM_REPO\` — set version:"
            head -1 "$RULES_DIR"/durables.md 2>/dev/null || true
            echo
            echo '```diff'
            git diff --unified=2 -- "$RULES_DIR" | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Only the rules belong in a sync PR — never anything the fetch or a
          # previous step happened to leave in the working tree.
          add-paths: |
            .claude/rules/**
          branch: chore/sync-shared-rules
          base: main
          title: "chore: sync shared durables rules from template"
          commit-message: "chore: sync shared durables rules from template"
          labels: rules
          delete-branch: true
          body: |
            Automated sync of `.claude/rules/` from
            `work-flowers/zapier-durables-template`.

            This file is the universal half of this repo's Claude Code
            instructions and is kept byte-identical across every Zap repo, so a
            lesson learned in one repo reaches all of them.

            **Read the diff before merging.** These rules govern how durables
            reach production — trigger handling, the publish pipeline, the
            determinism guard. See the run's Step Summary for the diff.

            If a change here is wrong *for this repo specifically*, don't edit
            this file to fix it — the next sync would revert you. Put the
            repo-specific exception in `CLAUDE.md` instead, and fix the shared
            file upstream.

            No Zap source changed, so `Publish Zaps` has nothing to deploy.
