# Deploy GitHub Pages
#
# Publishes `docs/` to https://work-flowers.github.io/zapier-sdk/ — the workflow
# map (map.html, embedded by work.flowers/zap-map) and the publishing-pipeline
# explainer (zap-publishing-pipeline.html, linked from the README).
#
# This replaced Pages' "Deploy from a branch" mode, which rebuilt and redeployed
# the site on EVERY push to `main` — each PR merge and each publish sync-back —
# republishing identical bytes.
#
# MANUAL ONLY since 2026-10-18. It used to deploy on every merged PR touching
# docs/; that trigger was removed along with the map's CI. The last deployment
# stays live — disabling this job does not unpublish the site (only turning
# Pages off in Settings does). Run it from the Actions tab, or
# `gh workflow run deploy-pages.yml`, to publish the current docs/.
#
# REQUIRES the repo's Pages source to be "GitHub Actions" (Settings → Pages →
# Build and deployment → Source). Under the old branch mode this job fails.
#
# Trigger: workflow_dispatch only.
#
# No Jekyll: docs/ is uploaded as-is. The .md files in docs/ are served raw
# rather than rendered; nothing links to their Pages URLs.

name: Deploy Pages

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one mid-flight (GitHub's recommended shape).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
